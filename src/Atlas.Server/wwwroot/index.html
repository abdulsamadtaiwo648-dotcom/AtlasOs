<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F7F6F3">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Atlas</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Password screen -->
  <section id="login" class="login hidden">
    <div class="login-card">
      <div class="brand"><span class="dot"></span> Atlas</div>
      <p class="muted">Enter the password shown on your PC when Atlas Server started.</p>
      <input id="tokenInput" type="password" autocomplete="current-password" placeholder="Password"
             autocapitalize="off" autocorrect="off" spellcheck="false">
      <button id="connectBtn" class="primary">Connect</button>
      <p id="loginError" class="error"></p>
    </div>
  </section>

  <!-- The app -->
  <div id="app" class="app hidden">
    <header class="top">
      <button id="menuBtn" class="icon" aria-label="Recent chats">&#9776;</button>
      <div id="title" class="title">Atlas</div>
      <button id="speakBtn" class="icon" aria-label="Read replies aloud" aria-pressed="false">&#128264;</button>
      <button id="newBtn" class="soft small">New</button>
    </header>

    <nav class="tabs">
      <button id="tabChat" class="tab active">Chat</button>
      <button id="tabMemory" class="tab">Memory</button>
    </nav>

    <!-- Chat -->
    <main id="chatView" class="view">
      <div id="messages" class="messages"></div>
      <div id="empty" class="empty">
        <h1>What can I help with?</h1>
        <p class="muted">Ask anything. Atlas is running on your PC.</p>
      </div>
    </main>

    <!-- Memory -->
    <main id="memoryView" class="view hidden">
      <div class="memory-tools">
        <div class="row">
          <input id="memoryNew" type="text" placeholder="Something to remember..." maxlength="4000">
          <button id="memoryAdd" class="primary small">Remember</button>
        </div>
        <input id="memorySearch" type="search" placeholder="Search memories...">
        <p id="memoryStatus" class="muted small-text"></p>
      </div>
      <div id="memoryList" class="memory-list"></div>
      <p id="memoryEmpty" class="empty-text muted hidden"></p>
    </main>

    <!-- Composer -->
    <footer id="composer" class="composer">
      <p id="micHint" class="muted small-text hidden">Tip: tap the microphone on your keyboard to dictate.</p>
      <div class="composer-row">
        <textarea id="input" rows="1" placeholder="Message Atlas..." maxlength="4000"></textarea>
        <button id="micBtn" class="icon hidden" aria-label="Dictate">&#127908;</button>
        <button id="sendBtn" class="send" aria-label="Send">&#10148;</button>
        <button id="stopBtn" class="send hidden" aria-label="Stop">&#9632;</button>
      </div>
    </footer>

    <!-- Recent chats -->
    <div id="scrim" class="scrim hidden"></div>
    <aside id="drawer" class="drawer">
      <div class="drawer-head">
        <strong>Recent chats</strong>
        <button id="drawerClose" class="icon" aria-label="Close">&#10005;</button>
      </div>
      <div id="chatList" class="chat-list"></div>
    </aside>

    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
